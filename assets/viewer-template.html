<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>__TITLE__</title>
<style>
  :root {
    --bg: #ffffff;
    --paper: #fbfbfa;
    --line: #d7d7d3;
    --line-soft: #ecece8;
    --ink: #1a1a1a;
    --muted: #6c6c68;
    --blue: #3C5488;
    --red: #E64B35;
    --ochre: #F39B7F;
    --particle-low: #EAEEF5;
    --particle-high: #3C5488;
    --font: Arial, Helvetica, "PingFang SC", "Microsoft YaHei", sans-serif;
  }
  * { box-sizing: border-box; }
  html, body { width: 100%; height: 100%; margin: 0; background: var(--bg); color: var(--ink);
    font: 12px/1.45 var(--font); overflow: hidden; }
  button, select { font: inherit; color: var(--ink); background: #fff; border: 1px solid var(--line);
    border-radius: 2px; padding: 5px 9px; cursor: pointer; }
  button:hover, select:hover { border-color: var(--ink); }
  button:focus-visible, select:focus-visible, input:focus-visible {
    outline: 2px solid rgba(60,84,136,.32); outline-offset: 1px; }
  button.primary { background: var(--blue); border-color: var(--blue); color: #fff; font-weight: 700; }
  #shell { width: 100%; height: 100%; display: grid;
    grid-template-columns: minmax(0, 1.12fr) minmax(560px, .88fr); }
  #stage { position: relative; min-width: 0; min-height: 0; border-right: 1px solid var(--line-soft);
    overflow: hidden; }
  #scene { position: absolute; inset: 0; }
  #scene canvas { display: block; }
  #head { position: absolute; left: 22px; top: 16px; z-index: 4; pointer-events: none;
    max-width: min(760px, calc(100% - 44px)); }
  h1 { margin: 0; font-size: 16px; font-weight: 700; letter-spacing: 0; }
  h1 span { margin-left: 8px; color: var(--muted); font-size: 11px; font-weight: 400; }
  #badge { display: inline-block; margin-top: 7px; padding-bottom: 2px; border-bottom: 1px solid var(--line);
    color: var(--muted); font-size: 11px; }
  #noteButton { pointer-events: auto; margin-top: 8px; padding: 2px 7px; color: var(--blue);
    border-color: var(--line-soft); background: rgba(255,255,255,.94); }
  #notes { position: absolute; left: 0; top: calc(100% + 8px); width: min(640px, calc(100vw - 44px));
    max-height: 62vh; overflow: auto; padding: 14px 16px; border: 1px solid var(--line);
    border-top: 2px solid var(--blue); background: #fff; box-shadow: 0 14px 36px rgba(0,0,0,.14);
    user-select: text; pointer-events: auto; }
  #notes[hidden] { display: none; }
  #notes h2 { margin: 0 0 8px; font-size: 13px; }
  #notes h3 { margin: 12px 0 4px; font-size: 11.5px; }
  #notes p, #notes li { color: var(--muted); font-size: 11px; }
  #notes ul { margin: 4px 0; padding-left: 18px; }
  #legend { position: absolute; left: 22px; bottom: 15px; z-index: 3; color: var(--muted);
    font-size: 10.5px; pointer-events: none; }
  .sw { display: inline-block; width: 14px; height: 2px; vertical-align: middle; margin-right: 5px; }
  #panel { min-width: 0; min-height: 0; overflow-y: auto; padding: 16px 20px 22px;
    display: flex; flex-direction: column; gap: 10px; background: #fff; }
  #panel::-webkit-scrollbar { width: 6px; }
  #panel::-webkit-scrollbar-thumb { background: #c8c8c8; border-radius: 3px; }
  .panel-head { display: flex; align-items: flex-start; gap: 10px; }
  .panel-head h2 { margin: 0; font-size: 13px; }
  .panel-head p { margin: 2px 0 0; color: var(--muted); font-size: 10.5px; }
  .spacer { flex: 1; }
  .controls { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
  .controls select { min-width: 168px; }
  input[type=range] { width: 100%; accent-color: var(--blue); }
  .frame-line { display: flex; justify-content: space-between; color: var(--muted);
    font-variant-numeric: tabular-nums; font-size: 10.5px; }
  .stats { display: grid; grid-template-columns: repeat(3, minmax(0,1fr));
    border-top: 1px solid var(--line); border-bottom: 1px solid var(--line-soft); }
  .stat { min-width: 0; padding: 7px 8px; border-left: 1px solid var(--line-soft); }
  .stat:nth-child(3n+1) { border-left: 0; padding-left: 0; }
  .stat span { display: block; color: var(--muted); font-size: 9.5px; }
  .stat b { display: block; margin-top: 1px; white-space: nowrap; font-size: 13px;
    font-variant-numeric: tabular-nums; }
  .chartbox { position: relative; min-height: 235px; border-top: 1px solid var(--line-soft); }
  .chartbox h3 { position: absolute; left: 4px; top: 4px; z-index: 2; margin: 0;
    font-size: 11px; font-weight: 400; pointer-events: none; }
  .echart { position: absolute; inset: 0; }
  .toggles { display: flex; gap: 14px; flex-wrap: wrap; color: var(--muted); font-size: 10.5px; }
  .toggles label { display: inline-flex; gap: 5px; align-items: center; cursor: pointer; }
  input[type=checkbox] { accent-color: var(--blue); }
  #err { position: fixed; left: 50%; top: 46%; transform: translate(-50%, -50%);
    z-index: 30; max-width: 760px; padding: 16px 20px; border: 1px solid var(--red);
    background: #FDEEEC; color: #7a2418; white-space: pre-wrap; }
  @media (max-width: 1000px) {
    #shell { grid-template-columns: 1fr; grid-template-rows: minmax(300px, 48vh) minmax(0,1fr); }
    #stage { border-right: 0; border-bottom: 1px solid var(--line-soft); }
    #legend { display: none; }
    #notes { position: fixed; left: 12px; right: 12px; bottom: 12px; top: auto;
      width: auto; max-height: 72vh; }
  }
  @media (max-width: 700px) {
    .stats { grid-template-columns: repeat(2,minmax(0,1fr)); }
    .stat:nth-child(3n+1) { border-left: 1px solid var(--line-soft); padding-left: 8px; }
    .stat:nth-child(2n+1) { border-left: 0; padding-left: 0; }
    #panel { padding: 14px; }
  }
</style>
</head>
<body>
<div id="shell">
  <main id="stage">
    <div id="scene"></div>
    <header id="head">
      <h1 id="title">PFC 全过程 Viewer <span>实测帧</span></h1>
      <div id="badge">—</div>
      <button id="noteButton" type="button" aria-expanded="false" aria-controls="notes">数据说明</button>
      <section id="notes" role="dialog" aria-modal="false" aria-labelledby="notesTitle" tabindex="-1" hidden>
        <h2 id="notesTitle">数据说明</h2>
        <p id="notesSummary"></p>
        <div id="notesBody"></div>
      </section>
    </header>
    <footer id="legend">
      <span><i class="sw" style="background:var(--blue)"></i>拉伸裂纹</span>
      <span><i class="sw" style="background:var(--red)"></i>剪切裂纹</span>
      <span style="margin-left:14px">颗粒颜色表示累计位移；所有视图只切换实测帧。</span>
    </footer>
  </main>
  <aside id="panel">
    <div class="panel-head">
      <div>
        <h2 id="panelTitle">加载全过程</h2>
        <p id="caseSubtitle">真实 PFC 状态帧 · 无位置插值</p>
      </div>
      <span class="spacer"></span>
      <button id="reset" type="button">重置视角</button>
    </div>
    <section class="controls">
      <select id="caseSelect" aria-label="选择实验 Case"></select>
      <button id="play" class="primary" type="button">▶ 播放</button>
      <button id="prev" type="button" aria-label="上一实测帧">◀</button>
      <button id="next" type="button" aria-label="下一实测帧">▶</button>
      <select id="speed" aria-label="播放速度">
        <option value="4">慢</option>
        <option value="8" selected>中</option>
        <option value="16">快</option>
      </select>
    </section>
    <section>
      <input id="timeline" type="range" min="0" max="1" step="1" value="0" aria-label="实测帧时间轴">
      <div class="frame-line">
        <span id="frameText">—</span>
        <span id="timeText">—</span>
      </div>
      <div class="controls" style="margin-top:6px">
        <label for="cycleInput">Cycle 定位</label>
        <input id="cycleInput" type="number" step="1" style="width:120px" aria-label="输入 Cycle 精确定位">
        <button id="cycleGo" type="button">定位</button>
      </div>
    </section>
    <section class="stats">
      <div class="stat"><span>轴向应力</span><b id="stress">—</b></div>
      <div class="stat"><span>轴向应变</span><b id="strain">—</b></div>
      <div class="stat"><span>平均轴向载荷</span><b id="load">—</b></div>
      <div class="stat"><span>轴向缩短</span><b id="displacement">—</b></div>
      <div class="stat"><span>当前 Ball</span><b id="balls">—</b></div>
      <div class="stat"><span>可见裂纹</span><b id="cracks">—</b></div>
    </section>
    <section class="chartbox">
      <h3><b>a</b> 应力–应变</h3>
      <div id="stressChart" class="echart"></div>
    </section>
    <section class="chartbox">
      <h3><b>b</b> 载荷–位移与裂纹增长</h3>
      <div id="responseChart" class="echart"></div>
    </section>
    <section class="toggles">
      <label><input id="showParticles" type="checkbox" checked>颗粒</label>
      <label><input id="showWalls" type="checkbox" checked>压板</label>
      <label><input id="showCracks" type="checkbox" checked>裂纹</label>
      <label><input id="uniformColor" type="checkbox">统一颗粒颜色</label>
    </section>
  </aside>
</div>
<div id="err" hidden></div>
<script>__THREE_JS__</script>
<script>__ORBIT_JS__</script>
<script>__ECHARTS_JS__</script>
<script>window.PFC_DATA = __DATA_JSON__;</script>
<script>
(function () {
  "use strict";
  var DATA = window.PFC_DATA;
  var body = document.body;
  var errorBox = document.getElementById("err");
  var state = { caseIndex: 0, frameIndex: 0, playing: false, fps: 8,
    showParticles: true, showWalls: true, showCracks: true, uniform: false };

  function showError(code, message, details) {
    body.setAttribute("data-error-code", code);
    body.setAttribute("data-error", "1");
    window.__PFC_VIEWER_ERROR__ = { code: code, message: message, details: details || null };
    errorBox.hidden = false;
    errorBox.textContent = message + (details ? "\n\n" + JSON.stringify(details, null, 2) : "");
  }
  function webglProbe() {
    var canvas = document.createElement("canvas");
    var names = ["webgl2", "webgl", "experimental-webgl"];
    for (var i = 0; i < names.length; i++) {
      try {
        var context = canvas.getContext(names[i]);
        if (context) return { available: true, context: names[i] };
      } catch (ignored) {}
    }
    return { available: false, context: null };
  }
  try {
    if (!DATA || !Array.isArray(DATA.cases) || !DATA.cases.length) {
      throw new Error("DATA_PAYLOAD_MISSING");
    }
    if (!window.THREE || !window.echarts) {
      throw new Error("OFFLINE_VENDOR_MISSING");
    }
    var webgl = webglProbe();
    body.setAttribute("data-webgl-status", webgl.available ? "available" : "unavailable");
    if (!webgl.available) {
      showError("WEBGL_UNAVAILABLE",
        "无法创建 WebGL 上下文。请开启硬件加速，或使用 Chromium/Edge SwiftShader。",
        { contextProbe: webgl, viewport: [innerWidth, innerHeight], userAgent: navigator.userAgent });
      return;
    }

    var $ = function (id) { return document.getElementById(id); };
    var fmt = function (value, digits) {
      if (!Number.isFinite(Number(value))) return "—";
      var v = Number(value), a = Math.abs(v);
      if (a !== 0 && (a < 1e-3 || a >= 1e5)) return v.toExponential(digits || 3);
      return v.toFixed(digits == null ? 3 : digits).replace(/0+$/, "").replace(/\.$/, "");
    };
    function decodeU32(base64) {
      var binary = atob(base64 || ""), bytes = new Uint8Array(binary.length);
      for (var i = 0; i < binary.length; i++) bytes[i] = binary.charCodeAt(i);
      var view = new DataView(bytes.buffer), out = new Uint32Array(bytes.length / 4);
      for (var j = 0; j < out.length; j++) out[j] = view.getUint32(j * 4, true);
      return out;
    }
    function decodeF32(base64) {
      var binary = atob(base64 || ""), bytes = new Uint8Array(binary.length);
      for (var i = 0; i < binary.length; i++) bytes[i] = binary.charCodeAt(i);
      var view = new DataView(bytes.buffer), out = new Float32Array(bytes.length / 4);
      for (var j = 0; j < out.length; j++) out[j] = view.getFloat32(j * 4, true);
      return out;
    }
    function upperBound(values, target) {
      var lo = 0, hi = values.length;
      while (lo < hi) { var mid = (lo + hi) >> 1;
        if (values[mid] <= target) lo = mid + 1; else hi = mid; }
      return lo;
    }
    function colorFromRamp(t) {
      var lo = [234,238,245], hi = [60,84,136];
      return new THREE.Color(
        (lo[0] + (hi[0]-lo[0])*t)/255,
        (lo[1] + (hi[1]-lo[1])*t)/255,
        (lo[2] + (hi[2]-lo[2])*t)/255
      );
    }

    $("title").innerHTML = String(DATA.meta.title).replace(/[&<>]/g, function (ch) {
      return {"&":"&amp;","<":"&lt;",">":"&gt;"}[ch];
    }) + " <span>Three.js + ECharts</span>";
    document.title = DATA.meta.title + " · PFC Viewer";
    if (DATA.meta.panelTitle) $("panelTitle").textContent = DATA.meta.panelTitle;
    $("notesSummary").textContent = DATA.meta.noteSummary || "真实 PFC 全过程数据";
    DATA.meta.noteSections.forEach(function (section) {
      var h = document.createElement("h3"); h.textContent = section.title;
      var ul = document.createElement("ul");
      section.items.forEach(function (item) {
        var li = document.createElement("li"); li.textContent = item; ul.appendChild(li);
      });
      $("notesBody").appendChild(h); $("notesBody").appendChild(ul);
    });
    $("noteButton").addEventListener("click", function () {
      $("notes").hidden = !$("notes").hidden;
      $("noteButton").setAttribute("aria-expanded", $("notes").hidden ? "false" : "true");
    });
    document.addEventListener("keydown", function (event) {
      if (event.key === "Escape" && !$("notes").hidden) $("notes").hidden = true;
    });

    var staticBalls = DATA.static.balls;
    var idToIndex = new Map(), radii = new Float32Array(staticBalls.length),
      liveRadii = new Float32Array(staticBalls.length),
      initialXYZ = new Float32Array(staticBalls.length * 3);
    staticBalls.forEach(function (b, i) {
      idToIndex.set(b[0], i); radii[i] = b[4];
      initialXYZ[i*3] = b[1]; initialXYZ[i*3+1] = b[2]; initialXYZ[i*3+2] = b[3];
    });

    var domain = DATA.meta.domain;
    var dmin = new THREE.Vector3().fromArray(domain.min);
    var dmax = new THREE.Vector3().fromArray(domain.max);
    var center = dmin.clone().add(dmax).multiplyScalar(.5);
    var span = Math.max(dmax.x-dmin.x, dmax.y-dmin.y, dmax.z-dmin.z, 1e-6);
    var scene = new THREE.Scene(); scene.background = new THREE.Color(0xffffff);
    var renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setPixelRatio(Math.min(devicePixelRatio || 1, 2));
    renderer.outputEncoding = THREE.sRGBEncoding;
    $("scene").appendChild(renderer.domElement);
    var camera = new THREE.PerspectiveCamera(40, 1, span*.001, span*100);
    camera.position.copy(center).add(new THREE.Vector3(span*1.25,-span*1.45,span*.72));
    var controls = new THREE.OrbitControls(camera, renderer.domElement);
    controls.target.copy(center); controls.enableDamping = true; controls.dampingFactor = .08;
    scene.add(new THREE.HemisphereLight(0xffffff,0x8491B4,.60));
    var light = new THREE.DirectionalLight(0xffffff,.48);
    light.position.copy(center).add(new THREE.Vector3(span,-span,span*2)); scene.add(light);
    var grid = new THREE.GridHelper(span*1.6,16,0xD5D8DE,0xEBEDF0);
    grid.position.set(center.x,dmin.y-span*.006,center.z);
    grid.material.transparent = true; grid.material.opacity = .65; scene.add(grid);
    var domainBox = new THREE.Box3Helper(new THREE.Box3(dmin.clone(),dmax.clone()),0xB4BAC6);
    domainBox.material.transparent = true; domainBox.material.opacity = .55; scene.add(domainBox);

    var particles = new THREE.InstancedMesh(
      new THREE.SphereGeometry(1,12,8),
      new THREE.MeshStandardMaterial({roughness:.7,metalness:.02}),
      staticBalls.length
    );
    particles.instanceMatrix.setUsage(THREE.DynamicDrawUsage);
    scene.add(particles);
    var dummy = new THREE.Object3D();

    var wallMeshes = DATA.static.walls.map(function (wall, wallIndex) {
      var geometry = new THREE.BufferGeometry();
      geometry.setAttribute("position", new THREE.BufferAttribute(new Float32Array(wall.vertices.length*3),3));
      geometry.setIndex([0,1,2,0,2,3]);
      var material = new THREE.MeshBasicMaterial({
        color: wallIndex === 0 ? 0x8491B4 : 0xB09C85,
        transparent: true, opacity: .18, side: THREE.DoubleSide, depthWrite: false
      });
      var mesh = new THREE.Mesh(geometry, material); mesh.renderOrder = 5; scene.add(mesh);
      var edges = new THREE.LineSegments(
        new THREE.BufferGeometry().setFromPoints(
          wall.vertices.map(function (vertex) { return new THREE.Vector3().fromArray(vertex.position); })
        ),
        new THREE.LineBasicMaterial({color: wallIndex === 0 ? 0x3C5488 : 0x7E6148, transparent:true, opacity:.9})
      );
      scene.add(edges);
      return { wall: wall, mesh: mesh, edges: edges };
    });

    var chart1 = echarts.init($("stressChart"), null, {renderer:"canvas"});
    var chart2 = echarts.init($("responseChart"), null, {renderer:"canvas"});
    var currentCase = null;
    var kindLayers = [];
    var activeCracks = [];

    function caseLabel(item) {
      return (item.label || ("Case " + item.id)) + " · " + item.frames.length + " 帧";
    }
    var caseSelect = $("caseSelect");
    DATA.cases.forEach(function (item, index) {
      var option = document.createElement("option"); option.value = String(index);
      option.textContent = caseLabel(item); caseSelect.appendChild(option);
    });

    function clearCracks() {
      kindLayers.forEach(function (layer) { scene.remove(layer.lines); layer.lines.geometry.dispose(); });
      kindLayers = [];
    }

    function buildCracks(item) {
      clearCracks();
      item.kinds.forEach(function (kind, kindIndex) {
        var records = item.cracks.filter(function (c) { return c[7] === kindIndex; })
          .sort(function (a,b) { return a[6]-b[6]; });
        var positions = new Float32Array(records.length*6);
        var ages = new Float64Array(records.length);
        records.forEach(function (c,i) {
          positions.set(c.slice(0,6),i*6); ages[i] = c[6];
        });
        var geometry = new THREE.BufferGeometry();
        geometry.setAttribute("position", new THREE.BufferAttribute(positions,3));
        var material = new THREE.LineBasicMaterial({
          color: kindIndex === 0 ? 0x3C5488 : 0xE64B35,
          transparent:true, opacity:1, depthTest:false
        });
        var lines = new THREE.LineSegments(geometry,material);
        lines.renderOrder = 20+kindIndex; lines.frustumCulled = false;
        scene.add(lines);
        kindLayers.push({kind:kind,lines:lines,ages:ages,records:records});
      });
    }

    function visibleCrackCount(frameCycle) {
      var total = 0;
      kindLayers.forEach(function (layer) {
        var count = upperBound(layer.ages,frameCycle);
        layer.lines.geometry.setDrawRange(0,count*2); total += count;
      });
      return total;
    }

    function updateWalls(frame) {
      wallMeshes.forEach(function (entry, wallIndex) {
        var byId = new Map();
        frame.walls.forEach(function (v) { byId.set(v[0],v); });
        var position = entry.mesh.geometry.attributes.position;
        entry.wall.vertices.forEach(function (vertex, index) {
          var v = byId.get(vertex.id);
          position.setXYZ(index,v[1],v[2],v[3]);
        });
        position.needsUpdate = true;
        entry.mesh.geometry.computeVertexNormals();
        var points = entry.wall.vertices.map(function (vertex) {
          var v = byId.get(vertex.id); return new THREE.Vector3(v[1],v[2],v[3]);
        });
        entry.edges.geometry.dispose();
        entry.edges.geometry = new THREE.BufferGeometry().setFromPoints(points);
        entry.mesh.visible = state.showWalls; entry.edges.visible = state.showWalls;
      });
    }

    function updateParticles(frame, frameIndex) {
      var ids = decodeU32(frame.ids), xyz = decodeF32(frame.xyz);
      var present = new Uint8Array(staticBalls.length);
      var maxDisp = Math.max(currentCase.maxDisplacement,1e-9);
      liveRadii.set(radii);
      (currentCase.radiusUpdates || []).forEach(function (update) {
        if (update.frameIndex > frameIndex) return;
        var updateIds = decodeU32(update.ids);
        var updateRadii = decodeF32(update.radii);
        for (var u=0;u<updateIds.length;u++) {
          var radiusIndex = idToIndex.get(updateIds[u]);
          if (radiusIndex != null) liveRadii[radiusIndex] = updateRadii[u];
        }
      });
      for (var i=0;i<ids.length;i++) {
        var index = idToIndex.get(ids[i]);
        if (index == null) continue;
        present[index] = 1;
        var x=xyz[i*3], y=xyz[i*3+1], z=xyz[i*3+2];
        dummy.position.set(x,y,z); dummy.scale.setScalar(liveRadii[index]);
        dummy.updateMatrix(); particles.setMatrixAt(index,dummy.matrix);
        var dx=x-initialXYZ[index*3], dy=y-initialXYZ[index*3+1], dz=z-initialXYZ[index*3+2];
        var d=Math.sqrt(dx*dx+dy*dy+dz*dz);
        var color = state.uniform ? new THREE.Color(0xC4C9D4) :
          colorFromRamp(Math.min(1,Math.pow(d/maxDisp,.62)));
        particles.setColorAt(index,color);
      }
      for (var j=0;j<present.length;j++) {
        if (!present[j]) {
          dummy.position.set(0,0,0); dummy.scale.setScalar(0);
          dummy.updateMatrix(); particles.setMatrixAt(j,dummy.matrix);
        }
      }
      particles.instanceMatrix.needsUpdate = true;
      if (particles.instanceColor) particles.instanceColor.needsUpdate = true;
      particles.visible = state.showParticles;
      body.setAttribute("data-frame-ball-count",String(ids.length));
      body.setAttribute("data-missing-ball-count",String(staticBalls.length-ids.length));
    }

    function chartBase(series, xName, yName, y2Name) {
      var option = {
        animation:false, backgroundColor:"transparent",
        grid:{left:58,right:y2Name?58:18,top:42,bottom:46},
        tooltip:{trigger:"axis"},
        xAxis:{type:"value",name:xName,nameLocation:"middle",nameGap:26,
          axisLine:{onZero:false,lineStyle:{color:"#333",width:.8}},
          axisTick:{lineStyle:{color:"#333"},length:3},splitLine:{show:false},
          axisLabel:{color:"#6c6c68",fontSize:9}},
        yAxis:{type:"value",name:yName,nameLocation:"middle",nameGap:40,
          axisLine:{onZero:false,lineStyle:{color:"#333",width:.8}},
          axisTick:{lineStyle:{color:"#333"},length:3},splitLine:{show:false},
          axisLabel:{color:"#6c6c68",fontSize:9}},
        series:series
      };
      if (y2Name) option.yAxis = [option.yAxis,
        {type:"value",name:y2Name,nameLocation:"middle",nameGap:40,
          axisLine:{onZero:false,lineStyle:{color:"#333",width:.8}},
          axisTick:{lineStyle:{color:"#333"},length:3},splitLine:{show:false},
          axisLabel:{color:"#6c6c68",fontSize:9}}];
      return option;
    }
    function marker(frame) { return frame ? frame.cycle : null; }
    function updateCharts(frame) {
      var h = currentCase.history;
      var stressData = h.cycle.map(function (step,i) { return [h.strain[i],h.stress_mpa[i]]; });
      chart1.setOption(chartBase([{
        type:"line",showSymbol:false,data:stressData,lineStyle:{color:"#3C5488",width:1.5},
        markLine:{symbol:"none",silent:true,label:{show:false},
          lineStyle:{color:"#1a1a1a",width:.8,type:"dashed"},
          data:[{xAxis:frame.strain}]},
        markPoint:{symbol:"circle",symbolSize:7,label:{show:false},itemStyle:{color:"#1a1a1a"},
          data:[{coord:[frame.strain,frame.stress_mpa]}]}
      }],"ε","σ (MPa)"),{notMerge:true,lazyUpdate:true});

      var loadData = h.cycle.map(function (step,i) { return [h.displacement_m[i],h.load_n[i]/1e6]; });
      var crackData = h.cycle.map(function (step,i) { return [h.displacement_m[i],h.cracks[i]]; });
      var series = [{type:"line",name:"载荷",showSymbol:false,data:loadData,
        lineStyle:{color:"#3C5488",width:1.45},
        markLine:{symbol:"none",silent:true,label:{show:false},
          lineStyle:{color:"#1a1a1a",width:.8,type:"dashed"},
          data:[{xAxis:frame.displacement_m}]}}];
      if (currentCase.cracksAvailable) {
        series.push({type:"line",name:"裂纹",yAxisIndex:1,showSymbol:false,data:crackData,
          lineStyle:{color:"#E64B35",width:1.25}});
      }
      chart2.setOption(chartBase(series,"轴向缩短 (m)","载荷 (MN)",
        currentCase.cracksAvailable ? "裂纹数" : null),{notMerge:true,lazyUpdate:true});
      body.setAttribute("data-crack-channel",currentCase.cracksAvailable ? "available" : "missing");
    }

    function setFrame(index, force) {
      index = Math.max(0,Math.min(currentCase.frames.length-1,index));
      if (!force && index===state.frameIndex) return;
      state.frameIndex=index;
      var frame=currentCase.frames[index];
      $("timeline").value=String(index);
      $("frameText").textContent="实测帧 "+(index+1)+" / "+currentCase.frames.length;
      $("timeText").textContent="Cycle "+frame.cycle+" · t="+fmt(frame.mechanical_time_total,6)+" s";
      $("stress").textContent=fmt(frame.stress_mpa,3)+" MPa";
      $("strain").textContent=fmt(frame.strain,5);
      $("load").textContent=fmt(frame.load_n/1e6,3)+" MN";
      $("displacement").textContent=fmt(frame.displacement_m,5)+" m";
      $("balls").textContent=String(frame.ballCount);
      var crackCount=visibleCrackCount(frame.cycle);
      $("cracks").textContent=currentCase.cracksAvailable ? String(crackCount) : "未采集";
      $("caseSubtitle").textContent=currentCase.subtitle;
      updateParticles(frame,index); updateWalls(frame); updateCharts(frame);
      body.setAttribute("data-ready","1");
      body.setAttribute("data-frame-index",String(index));
      body.setAttribute("data-cycle",String(frame.cycle));
      body.setAttribute("data-cracks-visible",String(crackCount));
      body.setAttribute("data-case-id",String(currentCase.id));
    }

    function setCase(index) {
      state.caseIndex=Math.max(0,Math.min(DATA.cases.length-1,index));
      currentCase=DATA.cases[state.caseIndex];
      state.frameIndex=0; state.playing=false; $("play").textContent="▶ 播放";
      $("timeline").min="0"; $("timeline").max=String(currentCase.frames.length-1);
      $("timeline").value="0"; $("caseSelect").value=String(state.caseIndex);
      buildCracks(currentCase);
      body.setAttribute("data-case-id",String(currentCase.id));
      body.setAttribute("data-frame-count",String(currentCase.frames.length));
      $("badge").textContent=currentCase.runId+" · "+currentCase.frames.length+" 个实测状态帧 · 无插值";
      setFrame(0,true);
    }

    caseSelect.addEventListener("change",function(e){setCase(Number(e.target.value));});
    $("timeline").addEventListener("input",function(e){state.playing=false;$("play").textContent="▶ 播放";setFrame(Number(e.target.value),true);});
    $("cycleGo").addEventListener("click",function(){
      var target=Number($("cycleInput").value);
      if(!Number.isFinite(target))return;
      var idx=currentCase.frames.findIndex(function(frame){return frame.cycle===target;});
      if(idx<0){
        $("cycleInput").setCustomValidity("该 run 中没有精确采集到该 Cycle；不会插值。");
        $("cycleInput").reportValidity();
        return;
      }
      $("cycleInput").setCustomValidity("");
      state.playing=false;$("play").textContent="▶ 播放";setFrame(idx,true);
    });
    $("cycleInput").addEventListener("input",function(){this.setCustomValidity("");});
    $("prev").addEventListener("click",function(){state.playing=false;$("play").textContent="▶ 播放";setFrame(state.frameIndex-1,true);});
    $("next").addEventListener("click",function(){state.playing=false;$("play").textContent="▶ 播放";setFrame(state.frameIndex+1,true);});
    $("play").addEventListener("click",function(){
      if (!state.playing && state.frameIndex>=currentCase.frames.length-1) setFrame(0,true);
      state.playing=!state.playing; $("play").textContent=state.playing?"⏸ 暂停":"▶ 播放";
    });
    $("speed").addEventListener("change",function(e){state.fps=Number(e.target.value)||8;});
    $("showParticles").addEventListener("change",function(e){state.showParticles=e.target.checked;particles.visible=state.showParticles;});
    $("showWalls").addEventListener("change",function(e){state.showWalls=e.target.checked;
      wallMeshes.forEach(function(w){w.mesh.visible=state.showWalls;w.edges.visible=state.showWalls;});});
    $("showCracks").addEventListener("change",function(e){state.showCracks=e.target.checked;
      kindLayers.forEach(function(l){l.lines.visible=state.showCracks;});});
    $("uniformColor").addEventListener("change",function(e){state.uniform=e.target.checked;setFrame(state.frameIndex,true);});
    $("reset").addEventListener("click",function(){camera.position.copy(center).add(new THREE.Vector3(span*1.25,-span*1.45,span*.72));controls.target.copy(center);controls.update();});
    document.addEventListener("keydown",function(e){
      if(e.code==="Space"){e.preventDefault();$("play").click();}
      else if(e.code==="ArrowLeft"){e.preventDefault();$("prev").click();}
      else if(e.code==="ArrowRight"){e.preventDefault();$("next").click();}
      else if(e.code==="Home"){setFrame(0,true);}
      else if(e.code==="End"){setFrame(currentCase.frames.length-1,true);}
    });
    chart1.on("click",function(p){if(p.dataIndex!=null)setFrame(p.dataIndex,true);});
    chart2.on("click",function(p){if(p.dataIndex!=null)setFrame(p.dataIndex,true);});

    function resize() {
      var w=Math.max(1,$("stage").clientWidth), h=Math.max(1,$("stage").clientHeight);
      camera.aspect=w/h;camera.updateProjectionMatrix();
      renderer.setPixelRatio(Math.min(devicePixelRatio||1,2));renderer.setSize(w,h);
      chart1.resize();chart2.resize();
    }
    addEventListener("resize",resize);
    var initialCase=DATA.cases.findIndex(function(c){return c.id===DATA.meta.defaultCase;});
    setCase(initialCase>=0?initialCase:0); resize();
    document.querySelectorAll(".echart canvas").forEach(function(el){});
    body.setAttribute("data-chart-canvases",String(document.querySelectorAll(".echart canvas").length));
    body.setAttribute("data-schema-version",String(DATA.meta.schema_version));
    var last=performance.now(), acc=0;
    function tick(now){
      requestAnimationFrame(tick);
      var dt=Math.min(.1,(now-last)/1000);last=now;
      if(state.playing){acc+=dt;if(acc>=1/state.fps){acc=0;
        if(state.frameIndex>=currentCase.frames.length-1){state.playing=false;$("play").textContent="▶ 播放";}
        else setFrame(state.frameIndex+1,false);}}
      controls.update();renderer.render(scene,camera);
      body.setAttribute("data-ready","1");
    }
    requestAnimationFrame(tick);
  } catch (error) {
    showError(error.code || "VIEWER_RUNTIME_ERROR",
      String(error.stack || error), {userAgent:navigator.userAgent,viewport:[innerWidth,innerHeight]});
  }
})();
</script>
</body>
</html>
